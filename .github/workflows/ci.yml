name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    # 30min because the first cold install of the Medusa monorepo dep tree
    # is ~12-15min. Subsequent PRs hit the npm cache and finish in ~2-3min.
    timeout-minutes: 30

    # A throwaway Postgres for the tests that run the lab module's real
    # migrations (apps/backend/src/modules/lms/__tests__/*.db.spec.ts).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (root workspace)
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Typecheck
        working-directory: apps/backend
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: apps/backend
        run: npm run test:unit

      - name: Database tests
        working-directory: apps/backend
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: npm run test:db

      # Starts the whole backend on a scratch database, signs in as a lab
      # account and calls every admin route: it must be refused on all of
      # them except the lab's own (src/api/admin/lab-gate.ts).
      - name: Lab account test (real server)
        working-directory: apps/backend
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
        run: npm run test:integration:http
